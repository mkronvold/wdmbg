name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Format check
        run: corepack pnpm format:check

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/probe/go.mod
          cache-dependency-path: apps/probe/go.sum

      - name: Install libpcap (linux probe build)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Probe tests
        working-directory: apps/probe
        run: go test ./...

      - name: Probe linux build
        working-directory: apps/probe
        run: go build -o /tmp/wdmbg-probe .
